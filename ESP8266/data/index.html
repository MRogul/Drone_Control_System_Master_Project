<!DOCTYPE html>
<html>
<head>
    <title>PID controller dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="topnav">
        <h1>Drone PID controllers</h1>
    </div>
    <div class="content">
    <div class="card-grid">
        <!-- PID Sliders -->
        <div class="card">
            <p class="card-title">Kp</p>
            <p class="switch">
                <input type="range" onchange="updateSliderPWM(this)" id="slider1" min="0" max="100" step="1" value="0" class="slider">
            </p>
            <p class="state"><span id="sliderValue1"></span>%</p>
        </div>
        <div class="card">
            <p class="card-title">Ki</p>
            <p class="switch">
                <input type="range" onchange="updateSliderPWM(this)" id="slider2" min="0" max="100" step="1" value="0" class="slider">
            </p>
            <p class="state"><span id="sliderValue2"></span>%</p>
        </div>
        <div class="card">
            <p class="card-title">Kd</p>
            <p class="switch">
                <input type="range" onchange="updateSliderPWM(this)" id="slider3" min="0" max="100" step="1" value="0" class="slider">
            </p>
            <p class="state"><span id="sliderValue3"></span>%</p>
        </div>
        <div class="card">
            <p class="card-title">Tau</p>
            <p class="switch">
                <input type="range" onchange="updateSliderPWM(this)" id="slider4" min="0" max="100" step="1" value="0" class="slider">
            </p>
            <p class="state"><span id="sliderValue4"></span>%</p>
        </div>
        
        <!-- New Sliders - Roll, Pitch, Yaw, Z -->
        <div class="card">
            <p class="card-title">Roll</p>
            <p class="switch">
                <input type="range" onchange="updateSliderPWM(this)" id="slider5" min="0" max="100" step="1" value="0" class="slider">
            </p>
            <p class="state"><span id="sliderValue5"></span>%</p>
        </div>
        <div class="card">
            <p class="card-title">Pitch</p>
            <p class="switch">
                <input type="range" onchange="updateSliderPWM(this)" id="slider6" min="0" max="100" step="1" value="0" class="slider">
            </p>
            <p class="state"><span id="sliderValue6"></span>%</p>
        </div>
        <div class="card">
            <p class="card-title">Yaw</p>
            <p class="switch">
                <input type="range" onchange="updateSliderPWM(this)" id="slider7" min="0" max="100" step="1" value="0" class="slider">
            </p>
            <p class="state"><span id="sliderValue7"></span>%</p>
        </div>
        <div class="card">
            <p class="card-title">Z</p>
            <p class="switch">
                <input type="range" onchange="updateSliderPWM(this)" id="slider8" min="0" max="100" step="1" value="0" class="slider">
            </p>
            <p class="state"><span id="sliderValue8"></span>%</p>
        </div>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
